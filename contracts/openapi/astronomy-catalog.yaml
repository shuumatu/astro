openapi: 3.1.0
info:
  title: Astro Astronomy Catalog API
  version: 0.1.0
  description: Versioned catalog discovery for browser-side sky chart calculations.
servers:
  - url: /
    description: Current host through the API gateway
security: []
paths:
  /api/astronomy/catalogs/naked-eye/manifest:
    get:
      operationId: getNakedEyeCatalogManifest
      summary: Get the currently published naked-eye catalog
      responses:
        "200":
          description: The published catalog manifest.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Requires revalidation so clients discover a newly published version.
            ETag:
              schema:
                type: string
              description: Changes when the published catalog version changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogManifest"
        "503":
          description: No validated catalog has been published yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/astronomy/catalogs/naked-eye/{version}:
    get:
      operationId: getNakedEyeCatalog
      summary: Download an immutable version of the naked-eye catalog
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      responses:
        "200":
          description: Gzip-compressed catalog bytes.
          headers:
            Content-Encoding:
              schema:
                type: string
                const: gzip
            Content-Length:
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              schema:
                type: string
              description: Public immutable caching for the versioned resource.
            ETag:
              schema:
                type: string
              description: SHA-256 of the encoded response bytes, surrounded by quotes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkyCatalog"
        "404":
          description: The requested catalog version is not published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The published asset failed integrity validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/astronomy/catalogs/sky-content/manifest:
    get:
      operationId: getSkyContentManifest
      summary: Get the currently published sky-culture resource manifest
      responses:
        "200":
          description: The published culture, search-index and featured-pattern resource manifest.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Requires revalidation so clients discover newly published versions.
            ETag:
              schema:
                type: string
              description: Changes when the published sky-content version changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkyContentManifest"
        "503":
          description: No validated sky-content manifest has been published yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/astronomy/catalogs/sky-content/{assetId}/{version}:
    get:
      operationId: getSkyContentAsset
      summary: Download an immutable sky-culture, search-index or featured-pattern resource
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        - name: version
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      responses:
        "200":
          description: Gzip-compressed JSON bytes matching the selected manifest descriptor.
          headers:
            Content-Encoding:
              schema:
                type: string
                const: gzip
            Content-Length:
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              schema:
                type: string
              description: Public immutable caching for the versioned resource.
            ETag:
              schema:
                type: string
              description: SHA-256 of the encoded response bytes, surrounded by quotes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkyContentResource"
        "404":
          description: The asset ID and version pair is not declared by the manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The published asset failed integrity validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    CatalogManifest:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - catalogId
        - version
        - downloadUrl
        - mediaType
        - contentEncoding
        - sha256
        - contentLength
        - decodedSha256
        - decodedContentLength
        - starCount
        - sources
        - publishedAt
      properties:
        schemaVersion:
          type: integer
          const: 2
        catalogId:
          type: string
          const: naked-eye
        version:
          type: string
          minLength: 1
        downloadUrl:
          type: string
          format: uri-reference
        mediaType:
          type: string
          const: application/json
        contentEncoding:
          type: string
          enum: [identity, br, gzip]
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        contentLength:
          type: integer
          minimum: 1
        decodedSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: SHA-256 of the decoded JSON bytes exposed by the browser Fetch API.
        decodedContentLength:
          type: integer
          minimum: 1
          description: Length of the decoded JSON bytes exposed by the browser Fetch API.
        starCount:
          type: integer
          minimum: 1
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CatalogSource"
        publishedAt:
          type: string
          format: date-time
    CatalogSource:
      type: object
      additionalProperties: false
      required: [catalog, release, url, credit]
      properties:
        catalog:
          type: string
          minLength: 1
        release:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        credit:
          type: string
          minLength: 1
    SkyCatalog:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - catalogId
        - referenceFrame
        - visualMagnitudeLimit
        - stars
      properties:
        schemaVersion:
          type: integer
          const: 2
        catalogId:
          type: string
          const: naked-eye
        referenceFrame:
          type: string
          const: ICRS
        visualMagnitudeLimit:
          type: number
          const: 6.5
        stars:
          type: array
          items:
            $ref: "#/components/schemas/StarRecord"
    StarRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - hipId
        - gaiaDr3Id
        - tycho2Id
        - hdId
        - raDeg
        - decDeg
        - epochYear
        - pmRaMasPerYear
        - pmDecMasPerYear
        - parallaxMas
        - visualMagnitude
        - colorIndex
        - spectralType
        - astrometrySource
      properties:
        id:
          type: string
          pattern: "^HIP:[1-9][0-9]*$"
        hipId:
          type: integer
          minimum: 1
        gaiaDr3Id:
          type: [string, "null"]
          pattern: "^[0-9]+$"
        tycho2Id:
          type: [string, "null"]
          pattern: "^[0-9]+-[0-9]+-[0-9]+$"
        hdId:
          type: [integer, "null"]
          minimum: 1
        raDeg:
          type: number
          minimum: 0
          exclusiveMaximum: 360
        decDeg:
          type: number
          minimum: -90
          maximum: 90
        epochYear:
          type: number
          enum: [1991.25, 2016]
        pmRaMasPerYear:
          type: [number, "null"]
          description: Proper motion in right ascension, mu_alpha*cos(delta), in mas/year.
        pmDecMasPerYear:
          type: [number, "null"]
        parallaxMas:
          type: [number, "null"]
        visualMagnitude:
          type: number
          maximum: 6.5
          description: Johnson V magnitude from the original Hipparcos catalogue.
        colorIndex:
          type: [number, "null"]
          description: Johnson B-V colour index.
        spectralType:
          type: [string, "null"]
        astrometrySource:
          type: string
          enum: [GAIA_DR3, HIPPARCOS_2, HIPPARCOS]
    SkyContentManifest:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - catalogId
        - version
        - defaultCultureId
        - cultureIds
        - searchIndexAssetId
        - featuredPatternsAssetId
        - nameFallbackOrder
        - assets
        - publishedAt
      properties:
        schemaVersion:
          type: integer
          const: 1
        catalogId:
          type: string
          const: sky-content
        version:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        defaultCultureId:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        cultureIds:
          type: array
          minItems: 1
          items:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        searchIndexAssetId:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        featuredPatternsAssetId:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        nameFallbackOrder:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        assets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SkyContentAssetDescriptor"
        publishedAt:
          type: string
          format: date-time
    SkyContentAssetDescriptor:
      type: object
      additionalProperties: false
      required:
        - assetId
        - assetType
        - version
        - downloadUrl
        - mediaType
        - contentEncoding
        - sha256
        - contentLength
        - decodedSha256
        - decodedContentLength
        - recordCounts
      properties:
        assetId:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        assetType:
          type: string
          enum: [culture, search-index, featured-patterns]
        cultureId:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        version:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        downloadUrl:
          type: string
          format: uri-reference
        mediaType:
          type: string
          const: application/json
        contentEncoding:
          type: string
          const: gzip
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        contentLength:
          type: integer
          minimum: 1
        decodedSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        decodedContentLength:
          type: integer
          minimum: 1
        recordCounts:
          type: object
          minProperties: 1
          additionalProperties:
            type: integer
            minimum: 0
    SkyContentResource:
      type: object
      description: >-
        A SkyCulturePack, global search index or FeaturedPatternPack. The canonical
        maintainable schemas are tools/catalog/sky-content/schema/*.schema.json.
      required: [schemaVersion, id, version]
      properties:
        schemaVersion:
          type: integer
          const: 1
        id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
      additionalProperties: true
    ApiError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [CATALOG_UNAVAILABLE, CATALOG_NOT_FOUND]
