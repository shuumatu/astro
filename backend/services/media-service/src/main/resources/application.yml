server:
  port: ${SERVER_PORT:8085}
spring:
  application:
    name: media-service
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
astro:
  security:
    jwt-secret: ${ASTRO_JWT_SECRET:astro-local-development-secret-change-before-production}
  media:
    endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9000}
    region: ${MEDIA_S3_REGION:us-east-1}
    access-key: ${MEDIA_S3_ACCESS_KEY:${MINIO_ROOT_USER:astro}}
    secret-key: ${MEDIA_S3_SECRET_KEY:${MINIO_ROOT_PASSWORD:change_me_before_start}}
    bucket: ${MEDIA_S3_BUCKET:${MINIO_BUCKET:astro-catalog-media}}
    key-prefix: ${MEDIA_S3_KEY_PREFIX:catalog}
    path-style: ${MEDIA_S3_PATH_STYLE:true}
    auto-create-bucket: ${MEDIA_S3_AUTO_CREATE_BUCKET:true}
    delivery-mode: ${MEDIA_DELIVERY_MODE:proxy}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:/api/media/assets}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
