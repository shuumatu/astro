server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: astronomy-service
astro:
  catalog:
    naked-eye:
      manifest-location: classpath:catalogs/naked-eye/manifest.json
      asset-location: classpath:catalogs/naked-eye/catalog.json.gz
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
